name: Sync

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Sync
      run: |
        git config --global pull.rebase false
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git remote add upstream https://github.com/MakoStar/ss-data

        git fetch upstream
        git fetch --all --prune
        git merge --allow-unrelated-histories -X theirs --no-edit upstream/main

        node fetchHitSource.js

        dotnet run --project hotfix/analyze

        SCRIPTS=(arena.js ascension.js blitz.js cata.js characterid.js character.js disc.js duel.js gacha.js ground.js item.js raid.js siege.js word.js)
        for script in "${SCRIPTS[@]}"; do
          echo "Running $script"
          node "$script"
        done

    - name: Note
      continue-on-error: true
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: node note.js

    - name: Commit and push
      id: commit
      run: |
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -m 'sync'
        git push origin main
        echo "changed=true" >> "$GITHUB_OUTPUT"

    - name: Deploy
      if: steps.commit.outputs.changed == 'true'
      run: |
        if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
          curl -s -o /dev/null -w "%{http_code}" -d "" "${{ secrets.DEPLOY_HOOK_URL }}"
        else
          echo "No deploy hook URL configured"
        fi
