name: Sync

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Sync
      run: |
        git config --global pull.rebase false
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git remote add upstream https://github.com/MakoStar/ss-data

        git fetch upstream
        git fetch --all --prune
        git merge --allow-unrelated-histories -X theirs --no-edit upstream/main

        node fetchHitSource.js

        SCRIPTS=(arena.js ascension.js blitz.js cata.js characterid.js character.js disc.js duel.js gacha.js ground.js item.js raid.js siege.js word.js)
        for script in "${SCRIPTS[@]}"; do
          echo "Running $script"
          node "$script"
        done

    - name: Hotfix
      shell: bash
      run: |
        set -euo pipefail

        FETCHER_VERSION=v0.4.3
        FETCHER_DIR="$RUNNER_TEMP/resourcefetcher"
        mkdir -p "$FETCHER_DIR"
        curl -fsSL "https://github.com/MakoStar/ss-resource-fetcher/releases/download/$FETCHER_VERSION/ResourceFetcher-$FETCHER_VERSION-linux-x64.tar.gz" \
          | tar -xz -C "$FETCHER_DIR"
        chmod +x "$FETCHER_DIR/ResourceFetcher"

        SETTINGS=(
          -s GLOBAL.DEFAULT_REGION=EN
          -s GLOBAL.DEFAULT_PLATFORM=win
          -s TASK.CLIENT.FLAGS.OP.USE_RESOURCE_REGEX=true
          -s 'TASK.CLIENT.REGISTRY.RES_PATTERNS=[^ss_win\.mani$,^hotfix\.arch$]'
        )

        (cd "$FETCHER_DIR" && ./ResourceFetcher client -r \
          -s TASK.CLIENT.FLAGS.OP.DOWNLOAD_RESOURCE=false "${SETTINGS[@]}")
        MANIFEST="$FETCHER_DIR/output/Manifest/EN/win_resource_manifest.json"
        version="$(jq -er '[to_entries[]
          | select(.key == "hotfix.arch" or (.key | test("^p_[0-9]+_[un][.]hotfix[.]arch$")))
          | .value.Version] | max' "$MANIFEST")"

        current=""
        if [[ -f hotfix/out/version.json ]]; then
          current="$(jq -r '.version' hotfix/out/version.json)"
        fi

        if [[ "$version" == "$current" ]]; then
          echo "Hotfix already at version $version"
        else
          echo "Updating hotfix ${current:-none} -> $version"
          (cd "$FETCHER_DIR" && ./ResourceFetcher client "${SETTINGS[@]}")

          dotnet tool install --global ilspycmd --version 9.1.0.7988
          export PATH="$HOME/.dotnet/tools:$PATH"

          unzip -p "$FETCHER_DIR/output/Unpack/EN/win/hotfix.arch" Hotfix.dll > "$RUNNER_TEMP/Hotfix.dll"
          node hotfix/hotfix.js "$RUNNER_TEMP/Hotfix.dll"

          printf '{ "version": %s }\n' "$version" > hotfix/out/version.json
        fi

        dotnet run --project hotfix/analyze

    - name: Note
      continue-on-error: true
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: node note.js

    - name: Commit and push
      id: commit
      run: |
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -m 'sync'
        git push origin main
        echo "changed=true" >> "$GITHUB_OUTPUT"

    - name: Deploy
      if: steps.commit.outputs.changed == 'true'
      run: |
        if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
          curl -s -o /dev/null -w "%{http_code}" -d "" "${{ secrets.DEPLOY_HOOK_URL }}"
        else
          echo "No deploy hook URL configured"
        fi
